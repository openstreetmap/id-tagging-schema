# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 100
    cooldown:
      semver-minor-days: 7
      semver-patch-days: 7
    versioning-strategy: increase-if-necessary
    ignore:
      # ignore unreviewed LLM version and few susequent hotfix releases
      # see https://github.com/dawidd6/action-download-artifact/releases/tag/v23
      - dependency-name: "action-download-artifact"
        versions: [ "23", "24", "25", "26", "27" ]
      # ignore trivial releases of too often released package
      - dependency-name: "prettier"
        update-types: ["version-update:semver-patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
        applies-to: version-updates
